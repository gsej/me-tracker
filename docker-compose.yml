services:
  api:
    build:
      context: ./code/dotnet/Api
      dockerfile: Dockerfile
    ports:
      - "5200:8080"
    env_file:
      - ../me-tracker-private/.env
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - SqliteConnectionString=Data Source=/app/database/me-tracker.db
    volumes:
      - ../me-tracker-private/database:/app/database
    restart: always
