---
# Public repo cloned onto the box to build from (https = no auth needed).
metracker_repo: https://github.com/gsej/me-tracker.git
metracker_version: master

# Code (git clone / build source) vs data (DB + .env) — kept separate.
metracker_dir: /opt/me-tracker
metracker_data_dir: /opt/me-tracker-data

# The standalone deployment compose (committed in the repo).
metracker_compose_file: docker-compose.yml

# Source of the secret .env on the CONTROL machine: ansible/secrets/.env
# (gitignored — copy env.sample there and fill it in). The DB is NOT copied —
# the app creates an empty one, real data is restored out-of-band.
metracker_env_src: "{{ playbook_dir }}/secrets/.env"

# --- Tailscale (phase 2: public exposure via Funnel) ------------------------
# OAuth client secret (auth_keys scope, tagged tag:metracker) on the CONTROL
# machine: ansible/secrets/tailscale-oauth.env (gitignored), same pattern as the
# .env above.
metracker_ts_oauth_src: "{{ playbook_dir }}/secrets/tailscale-oauth.env"
# MagicDNS hostname for the node. The public URL becomes
# https://{{ metracker_ts_hostname }}.<tailnet>.ts.net
metracker_ts_hostname: me-tracker
# ACL tag the node advertises — must match the OAuth client's tag.
metracker_ts_tags: tag:metracker
