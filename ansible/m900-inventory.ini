# M900 (ThinkCentre) me-tracker LXC built by Terraform (m900 workspace).
# ansible_host matches container_ip_cidr in infra/m900-terraform.tfvars.
# Select with: ansible-playbook -i m900-inventory.ini site.yml
#
# metracker_ts_hostname sets the Tailscale node name (and thus the Funnel URL:
# https://me-tracker-m900.<tailnet>.ts.net). The default (defaults/main.yml) is
# "me-tracker"; this box overrides it to a box-specific name so it coexists with
# the T14 node (me-tracker-t14) until T14 is decommissioned.

[metracker]
metracker-host ansible_host=192.168.1.221 metracker_ts_hostname=me-tracker-m900

[metracker:vars]
ansible_user=root
# Deploy private key lives in the repo (gitignored; restore from your password
# manager). inventory_dir resolves to this ansible/ dir regardless of cwd, so
# the key is shared across environments.
ansible_ssh_private_key_file={{ inventory_dir }}/secrets/deploy_key
