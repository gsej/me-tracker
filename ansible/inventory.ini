# One host: the me-tracker LXC built by Terraform.
# Set ansible_host to the container IP (matches container_ip_cidr in tfvars,
# also shown by `terraform output container_ip`).
#
# metracker_ts_hostname overrides the Tailscale node name (and thus the Funnel
# URL) for this deployment. The default (defaults/main.yml) is "me-tracker" —
# the canonical name reserved for the permanent M900 box. This laptop (T14) is a
# temporary stand-in, so it runs as "me-tracker-t14".

[metracker]
metracker-host ansible_host=192.168.1.132 metracker_ts_hostname=me-tracker-t14

[metracker:vars]
ansible_user=root
# Deploy private key lives in the repo (gitignored; restore from your password
# manager). inventory_dir resolves to this ansible/ dir regardless of cwd.
ansible_ssh_private_key_file={{ inventory_dir }}/secrets/deploy_key
