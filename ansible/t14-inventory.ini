# T14 (temporary laptop) me-tracker LXC built by Terraform (t14 workspace).
# ansible_host matches container_ip_cidr in infra/t14-terraform.tfvars.
# Select with: ansible-playbook -i t14-inventory.ini site.yml
#
# metracker_ts_hostname sets the Tailscale node name (and thus the Funnel URL:
# https://me-tracker-t14.<tailnet>.ts.net). The default (defaults/main.yml) is
# "me-tracker"; this temporary box overrides it to a box-specific name.

[metracker]
metracker-host ansible_host=192.168.1.132 metracker_ts_hostname=me-tracker-t14

[metracker:vars]
ansible_user=root
# Deploy private key lives in the repo (gitignored; restore from your password
# manager). inventory_dir resolves to this ansible/ dir regardless of cwd, so
# the key is shared across environments.
ansible_ssh_private_key_file={{ inventory_dir }}/secrets/deploy_key
