@let error = error$ | async;
@let isLoading = isLoading$ | async;
@let weightReport = weightReport$ | async;

@if (error) {
  <div
    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 flex-shrink-0"
  >
    <p>{{ error }}</p>
    <button
      class="mt-2 bg-red-500 hover:bg-red-600 text-white py-1 px-3 rounded text-sm"
      (click)="onRetry()"
    >
      Try Again
    </button>
  </div>
}

@if (!error && isLoading) {
  <div class="text-center py-4 flex-shrink-0">
    <p class="text-gray-500">Loading…</p>
  </div>
}

@if (!error && !isLoading && (!weightReport || weightReport.entries.length === 0)) {
  <div class="text-center py-4 flex-shrink-0">
    <p class="text-gray-500">No weight data to chart.</p>
  </div>
}

<div #chartContainer class="w-full flex-1 min-h-0"></div>
