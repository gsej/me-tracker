<div class="w-full  h-[calc(100%-3rem)] flex flex-col">
  <div class="relative pt-2 mb-2 landscape:pt-0">
    <h2 class="text-xl font-bold text-blue-500 text-center">Weight Chart</h2>
    <nav
      class="flex justify-center items-center gap-4 mt-2 text-sm"
    >
      @for (opt of rangeOptions; track opt.label) {
        <button
          type="button"
          (click)="selected = opt"
          class="px-1 transition-colors"
          [class.font-bold]="opt.label === selected.label"
          [class.text-blue-500]="opt.label === selected.label"
          [class.text-gray-400]="opt.label !== selected.label"
        >
          {{ opt.label }}
        </button>
      }
    </nav>
  </div>
  <div class="w-full flex-1 min-h-0 px-4 pb-4">
    <app-weight-chart [range]="selected.range" [importantOnly]="importantOnly">
      <!-- Shown directly under the chart's legend. -->
      <div class="flex justify-center pt-1 text-sm">
        <label class="flex items-center gap-1 text-gray-700" title="Untick to show all comments">
          <input
            type="checkbox"
            class="accent-blue-500"
            [checked]="importantOnly"
            (change)="importantOnly = $any($event.target).checked"
          />
          Show only important comments
        </label>
      </div>
    </app-weight-chart>
  </div>
</div>
