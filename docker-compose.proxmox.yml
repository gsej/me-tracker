# Deployment compose for the Proxmox LXC.
#
# Standalone — NOT merged with the dev docker-compose.yml, so the local dev
# workflow stays untouched. Differences from the dev compose: absolute paths
# to the data/secret location that Ansible provisions on the box
# (/opt/me-tracker-data), instead of the ../me-tracker-private sibling.
#
# Run (Ansible does this): docker compose -f docker-compose.proxmox.yml up -d --build
# GIT_HASH is supplied for interpolation via an --env-file (see the Ansible role).
services:
  api:
    build:
      context: ./code/dotnet/Api
      dockerfile: Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
    ports:
      - "5200:8080"
    env_file:
      # API keys — delivered by Ansible, on the container rootfs (not the mount).
      - /opt/me-tracker-data/.env
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - SqliteConnectionString=Data Source=/app/database/me-tracker.db
    volumes:
      # Dedicated persistent mount (Terraform). The DB lives here and survives
      # container rebuilds; seeded empty by the app, real data restored via the
      # API restore endpoint out-of-band.
      - /opt/me-tracker-data/database:/app/database
    restart: always
